# Configuración del Worker en tu propia cuenta de Cloudflare.
# Pasos completos en LEEME.md. `npm run configurar` rellena los marcadores por ti.
name = "enlace"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Registros de errores en el panel de Cloudflare (Workers & Pages → enlace → Logs).
[observability]
enabled = true

# Base de datos. Crea la tuya con:  npx wrangler d1 create enlace-db
# y pega aquí el database_id que imprime.
[[d1_databases]]
binding = "DB"
database_name = "enlace-db"
database_id = "PEGA_AQUI_EL_ID_DE_TU_BASE"
migrations_dir = "drizzle"

# Archivos adjuntos. Crea el bucket con:  npx wrangler r2 bucket create enlace-archivos
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "enlace-archivos"

# Valores públicos (no son secretos). Los secretos van con `npx wrangler secret put NOMBRE`.
[vars]
# Correo de Google de la cuenta principal de administración.
AULA_OWNER_EMAIL = "tu-correo@gmail.com"
# Opcional: limita el acceso a correos institucionales, separados por comas.
# ALLOWED_EMAIL_DOMAINS = "alumno.buap.mx,correo.buap.mx"
# Correos que pueden solicitar acceso como docente (si no se indica: correo.buap.mx).
# TEACHER_EMAIL_DOMAINS = "correo.buap.mx"
# Acceso con Microsoft (correo institucional): id del directorio (tenant) de la BUAP en Microsoft Entra.
# El Client ID y el Client secret van como secretos: npx wrangler secret put MICROSOFT_CLIENT_ID / MICROSOFT_CLIENT_SECRET
# MICROSOFT_TENANT_ID = "00000000-0000-0000-0000-000000000000"
# Dominios aceptados por Microsoft (por omisión: correo.buap.mx, alumno.buap.mx y buap.mx).
# MICROSOFT_EMAIL_DOMAINS = "correo.buap.mx,alumno.buap.mx"

# ── Entorno de pruebas ──────────────────────────────────────────────────────────────────────────
# Una copia independiente (enlace-pruebas.TU-SUBDOMINIO.workers.dev) con su propia base y archivos,
# para probar cambios antes de publicarlos a tus alumnos. Instrucciones en LEEME.md.
[env.pruebas]
name = "enlace-pruebas"

[env.pruebas.observability]
enabled = true

[[env.pruebas.d1_databases]]
binding = "DB"
database_name = "enlace-pruebas-db"
database_id = "PEGA_AQUI_EL_ID_DE_LA_BASE_DE_PRUEBAS"
migrations_dir = "drizzle"

[[env.pruebas.r2_buckets]]
binding = "BUCKET"
bucket_name = "enlace-pruebas-archivos"

[env.pruebas.vars]
AULA_OWNER_EMAIL = "tu-correo@gmail.com"
