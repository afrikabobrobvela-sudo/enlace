# Publica Enlace en Cloudflare desde GitHub, sin usar la computadora del responsable.
# Corre al fusionar en la rama principal (o a mano: Actions → Desplegar → Run workflow) y hace, en orden:
#   1) pruebas, 2) respaldo comprobado de la base a R2 privado, 3) migraciones, 4) publicación del Worker.
# Si un paso falla, se detiene ahí: sin respaldo comprobado no se migra; con pruebas en rojo no se publica.
#
# Hace lo mismo que `npm run configurar`: solo sustituye los dos marcadores de wrangler.toml (base y correo).
# Los secretos de la aplicación (Google, Microsoft, correo, SESSION_SECRET) viven en Cloudflare y no se tocan.
#
# Configuración (una sola vez, ver LEEME.md → «Desplegar desde GitHub»). Secrets del environment «produccion»
# (12.64: no del repositorio, para que un flujo de otra rama no pueda leerlos; el environment pide la aprobación del
# responsable y solo acepta la rama principal):
#   CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit, Workers R2 Storage: Edit),
#   CLOUDFLARE_ACCOUNT_ID, D1_DATABASE_ID y AULA_OWNER_EMAIL.
# El token solo está en los pasos que hablan con Cloudflare: la instalación y las pruebas corren sin él.
# El repositorio es público: el respaldo NUNCA se guarda como artefacto de GitHub, y los valores que salen de
# secrets (correo, id de la base) GitHub los oculta en el registro.
name: Desplegar
on:
  push:
    branches: [claude/plataforma-enlace-project-9ugeud]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desplegar
  cancel-in-progress: false
jobs:
  desplegar:
    runs-on: ubuntu-latest
    # Solo el repositorio del responsable y solo la rama principal (a mano desde otra rama no publica).
    if: ${{ github.repository_owner == 'afrikabobrobvela-sudo' && github.ref == 'refs/heads/claude/plataforma-enlace-project-9ugeud' }}
    environment: produccion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Exactamente lo de package-lock.json (npm install podía resolver otras versiones).
      - run: npm ci --no-audit --no-fund
      - name: Revisar configuración
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          OWNER: ${{ secrets.AULA_OWNER_EMAIL }}
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID OWNER; do
            if [ -z "${!v}" ]; then echo "::error::Falta un secret del environment produccion ($v; ver LEEME.md → Desplegar desde GitHub)"; exit 1; fi
          done
      - name: Pruebas
        run: npm test
      - name: Usar la base y la cuenta de producción
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          OWNER: ${{ secrets.AULA_OWNER_EMAIL }}
        run: |
          sed -i "s/PEGA_AQUI_EL_ID_DE_TU_BASE/${D1_DATABASE_ID}/" wrangler.toml
          sed -i "0,/AULA_OWNER_EMAIL = \"tu-correo@gmail.com\"/s//AULA_OWNER_EMAIL = \"${OWNER}\"/" wrangler.toml
          node scripts/revisar-config.mjs
      - name: Respaldo antes de migrar (R2 privado enlace-respaldos)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          STAMP=$(date -u +%Y-%m-%d-%H%M)
          npx wrangler d1 export DB --remote --output respaldo.sql
          node --input-type=module -e "import { readFileSync } from 'node:fs'; import { verifyDump } from './scripts/lib/dump.mjs'; await verifyDump(readFileSync('respaldo.sql', 'utf8')); console.log('Respaldo comprobado: se puede restaurar completo.');"
          gzip -9 respaldo.sql
          npx wrangler r2 object put "enlace-respaldos/antes-de-desplegar-${STAMP}.sql.gz" --file respaldo.sql.gz --remote --content-type application/gzip
      - name: Borrar la copia local del respaldo
        if: always()
        run: rm -f respaldo.sql respaldo.sql.gz
      - name: Migraciones
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote
      - name: Publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/build.mjs && npx wrangler deploy
